<div class="auth-page">
  <div class="panel card">
    <div class="brand"><span class="icon filled">sports_esports</span></div>
    <h1>Create your account</h1>
    <p class="muted">Join GameVault and start building your library.</p>

    <form [formRoot]="registerForm">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" class="input" autocomplete="name" [formField]="registerForm.name" />
        <app-field-errors [field]="registerForm.name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" class="input" type="email" autocomplete="email" [formField]="registerForm.email" />
        <app-field-errors [field]="registerForm.email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" class="input" type="password" autocomplete="new-password" [formField]="registerForm.password" />
        <app-field-errors [field]="registerForm.password" />
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" class="input" type="password" autocomplete="new-password" [formField]="registerForm.confirmPassword" />
        <app-field-errors [field]="registerForm.confirmPassword" />
      </div>

      @for (e of registerForm().errors(); track e.kind) {
        <div class="form-error"><span class="icon">error</span> {{ e.message }}</div>
      }

      <button class="btn primary lg block" type="submit" [disabled]="registerForm().submitting()">
        {{ registerForm().submitting() ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <p class="switch muted">
      Already have an account? <a routerLink="/login" [queryParams]="{ returnUrl: returnUrl() }">Sign in</a>
    </p>
  </div>
</div>
